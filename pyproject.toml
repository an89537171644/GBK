[project]
name = "sp63-rc-ai"
version = "0.1.0"
description = "SP 63 reinforced concrete calculation core and ML-assisted reinforcement selection prototype"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ml = ["scikit-learn", "joblib"]
ui = ["streamlit"]

[project.scripts]
sp63-core = "sp63_core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
